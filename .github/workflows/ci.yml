name: ci

on:
  push:
  pull_request:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.24", "1.25"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test with coverage
        run: |
          set -e
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out | tee coverage.txt
          total=$(grep total: coverage.txt | awk '{print $3}' | sed 's/%//')
          minimum=67.5
          target=90
          {
            echo "### Coverage"
            awk '/^total:/ {print "* Total coverage: " $3}' coverage.txt
            echo "* Ratchet floor: ${minimum}%"
            echo "* Target: ${target}%"
          } >> "$GITHUB_STEP_SUMMARY"
          if awk -v cov="$total" -v floor="$minimum" 'BEGIN {exit cov<floor?1:0}'; then
            echo "Coverage ratchet OK: ${total}%"
          else
            echo "Coverage ${total}% is below ratchet floor ${minimum}%" >&2
            exit 1
          fi
          if awk -v cov="$total" -v target="$target" 'BEGIN {exit cov<target?0:1}'; then
            echo "::notice::Coverage ${total}% is below the ${target}% target"
          fi
      - name: Generate coverage html
        run: go tool cover -html=coverage.out -o coverage.html
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-go-${{ matrix.go-version }}
          path: |
            coverage.out
            coverage.html
            coverage.txt
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          verbose: true
      - name: Build linux binary
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="-X github.com/svg153/reclaimit.Version=ci-${{ github.sha }}" -o dist/reclaimit_linux_amd64 ./cmd/reclaimit
          chmod +x dist/reclaimit_linux_amd64
      - name: Smoke test binary
        run: |
          go run ./cmd/reclaimit/ version
          go run ./cmd/reclaimit/ --help >/dev/null
          go run ./cmd/reclaimit/ help analyze >/dev/null
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: binary-dist-go-${{ matrix.go-version }}
          path: dist/reclaimit_linux_amd64

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Vet
        run: go vet ./...
      - name: Race detector
        run: go test -race ./...
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6 run ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
